<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Minigame 2 - จับผิดบ้านขนมหวาน</title>

    <style>

        /* =====================================================
           RESET
        ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html,
        body {
            width: 100%;
            height: 100%;

            overflow: hidden;

            background: #432314;
        }


        body {
            font-family:
                "Trebuchet MS",
                "Arial Rounded MT Bold",
                Arial,
                sans-serif;
        }


        /* =====================================================
           GAME CONTAINER

           อัตราส่วนภาพจริง = 1920 x 1080
           ใช้พื้นที่หน้าจอทั้งหมด
        ===================================================== */

        #game {
            position: fixed;

            left: 0;
            top: 0;

            width: 100vw;
            height: 100vh;

            overflow: hidden;

            background: #432314;
        }


        /* =====================================================
           GAME STAGE

           Stage มีขนาดตามภาพจริง 1920 x 1080
           แล้ว JavaScript จะ scale ให้พอดีกับหน้าจอ

           ข้อดี:
           - ไม่ใช้ background-size: cover
           - ภาพไม่โดนครอป
           - ตำแหน่ง UI จะสัมพันธ์กับ BG เสมอ
        ===================================================== */

        #stage {
            position: absolute;

            width: 1920px;
            height: 1080px;

            left: 50%;
            top: 50%;

            transform-origin: center center;

            background-image: url("BG_mini2.png");

            background-size: 1920px 1080px;

            background-position: center;

            background-repeat: no-repeat;
        }



        /* =====================================================
           TIMING
           
           ใช้ช่อง Timing ที่อยู่ใน BG แล้ว
           ไม่สร้างแถบใหม่
        ===================================================== */

        #timer {
            position: absolute;

            /*
                ครอบคลุมหลอด Timing สีน้ำตาลใน BG_mini2.png
                โดยอิงจาก Design Resolution 1920 x 1080
            */
            left: 330px;
            top: 827px;

            width: 790px;
            height: 92px;

            display: flex;
            align-items: center;
            justify-content: center;

            color: #663015;
            font-size: 32px;
            font-weight: bold;
            text-align: center;

            text-shadow:
                1px 2px 0 rgba(255, 255, 255, 0.55);

            /* ตัวหนังสืออยู่เหนือขีดเวลา */
            z-index: 30;
            pointer-events: none;
        }


        /*
            ทำให้คำว่า Timing และตัวเลขอยู่ชั้นบนสุด
            เพื่อให้ยังอ่านได้แม้ขีดเวลาจะอยู่ด้านหลัง
        */

        #timerLabel {
            margin-right: 18px;
            position: relative;
            z-index: 50;
        }


        #timerNumber {
            min-width: 45px;
            position: relative;
            z-index: 50;
            text-align: center;
        }


        /*
            ขีดนับเวลาถอยหลัง
            - ยาวให้พอดีกับหลอดสีน้ำตาลด้านล่าง
            - โปร่งใส เพื่อให้ยังเห็นพื้นหลังของหลอด
            - ลดจากขวาไปซ้ายตามเวลาที่เหลือ
        */

        #timerBar {
            position: absolute;
            left: 109px;
            top: 25px;
            width: 652px;
            height: 50px;
            background: transparent;
            border-radius: 999px;
            overflow: hidden;
            z-index: 10;
        }


        #timerBarFill {
            width: 100%;
            height: 100%;
            background: rgba(255, 248, 220, 0.32);
            border: 3px solid rgba(255, 255, 255, 0.18);
            border-radius: 999px;
            box-sizing: border-box;
            transition: width 1s linear;
        }



        /* =====================================================
           SCORE AREA
           
           ใช้ช่องคะแนนที่อยู่ใน BG
        ===================================================== */

        #scoreArea {
            position: absolute;

            /*
                ช่องลูกกวาดใน BG อยู่บริเวณ
                แถบสีทองด้านบนขวา
            */

            left: 1065px;
            top: 135px;

            width: 470px;
            height: 70px;

            display: flex;
            align-items: center;
            justify-content: flex-start;

            gap: 0px;

            z-index: 20;

            pointer-events: none;
        }

        /* ข้อความจำนวนลูกกวาดสะสม */
        #candyCount {
            position: absolute;
            left: 0;
            top: -60px;
            width: 470px;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #663015;
            font-size: 30px;
            font-weight: bold;
            text-align: center;
            text-shadow: 1px 2px 0 rgba(255, 255, 255, 0.55);
            z-index: 30;
            pointer-events: none;
        }



        /* =====================================================
           CANDY SLOT
        ===================================================== */

        .candy-slot {
            position: relative;

            width: 55px;
            height: 42px;

            display: flex;

            align-items: center;
            justify-content: center;

            opacity: 1;

            transform: scale(1);

            transition:
                opacity 0.25s ease,
                transform 0.25s ease;
        }


        .candy-slot.show {
            opacity: 1;

            transform: scale(0.9);
        }



        /* =====================================================
           CANDY GRAPHIC
        ===================================================== */

        .candy {
            position: relative;

            width: 52px;
            height: 34px;

            filter:
                drop-shadow(
                    0px 3px 2px rgba(80, 30, 10, 0.35)
                );
        }


        /* ตัวลูกกวาด */

        .candy-body {
            position: absolute;

            left: 14px;
            top: 4px;

            width: 26px;
            height: 26px;

            border-radius: 50%;

            background:
                repeating-linear-gradient(
                    135deg,
                    #f15b67 0px,
                    #f15b67 7px,
                    #fff2e8 7px,
                    #fff2e8 13px
                );

            border: 3px solid #9b3d2c;

            transform: rotate(-8deg);
        }


        /* กระดาษห่อด้านซ้าย */

        .candy-left {
            position: absolute;

            left: 0;
            top: 7px;

            width: 18px;
            height: 20px;

            background: #f05a68;

            clip-path: polygon(
                100% 50%,
                15% 0%,
                0% 50%,
                15% 100%
            );

            border: 2px solid #9b3d2c;
        }


        /* กระดาษห่อด้านขวา */

        .candy-right {
            position: absolute;

            right: 0;
            top: 7px;

            width: 18px;
            height: 20px;

            background: #f05a68;

            clip-path: polygon(
                0% 50%,
                85% 0%,
                100% 50%,
                85% 100%
            );

            border: 2px solid #9b3d2c;
        }



        /* =====================================================
           GAME OVER
        ===================================================== */

        #gameOver {
            position: absolute;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            width: 590px;

            padding: 42px 45px;

            background:
                linear-gradient(
                    to bottom,
                    #fff4d5,
                    #f5d49a
                );

            border: 8px solid #713719;

            border-radius: 35px;

            box-shadow:
                0 10px 0 #4e210f,
                0 15px 30px rgba(0, 0, 0, 0.35);

            text-align: center;

            z-index: 100;

            display: none;
        }


        #gameOver.show {
            display: block;
        }


        #gameOverTitle {
            color: #bd4535;

            font-size: 48px;

            font-weight: bold;

            margin-bottom: 15px;

            text-shadow:
                2px 3px 0 #ffffff;
        }


        #gameOverText {
            color: #713719;

            font-size: 25px;

            line-height: 1.6;

            font-weight: bold;

            margin-bottom: 25px;
        }


        #finalScore {
            color: #b64332;

            font-size: 30px;

            margin: 0 5px;
        }



        /* =====================================================
           RESTART BUTTON
        ===================================================== */

        #restartButton {
            border: none;

            padding: 13px 42px;

            min-width: 250px;

            border-radius: 25px;

            background:
                linear-gradient(
                    to bottom,
                    #ffd36c,
                    #e99b35
                );

            border: 5px solid #713719;

            color: #663015;

            font-size: 25px;

            font-weight: bold;

            cursor: pointer;

            box-shadow:
                0 5px 0 #54250f;

            transition:
                transform 0.12s ease,
                box-shadow 0.12s ease;
        }


        #restartButton:hover {
            transform: translateY(-2px);
        }


        #restartButton:active {
            transform: translateY(4px);

            box-shadow:
                0 1px 0 #54250f;
        }



        /* =====================================================
           RESPONSIVE GAME OVER

           เนื่องจากกล่อง Game Over อยู่บน Stage
           มันจะ scale ตาม Stage โดยอัตโนมัติ
        ===================================================== */

    </style>

</head>


<body>


    <!-- =====================================================
         GAME
    ===================================================== -->

    <div id="game">


        <!-- =================================================
             STAGE
        ================================================= -->

        <div id="stage">


            <!-- =================================================
                 TIMING

                 ใช้ช่องที่มีอยู่แล้วใน BG_mini2.png
            ================================================= -->

            <div id="timer">

                <span id="timerLabel">
                    Timing
                </span>

                <span id="timerNumber">
                    15
                </span>

                <div id="timerBar">
                    <div id="timerBarFill"></div>
                </div>

            </div>



            <!-- =================================================
                 SCORE

                 ลูกกวาด 2 ตำแหน่ง
            ================================================= -->

            <div id="scoreArea">

                <div id="candyCount">ลูกกวาดสะสม: 2/10</div>

                <!-- ลูกกวาดชิ้นที่ 1 -->

                <div
                    class="candy-slot"
                    id="candy1"
                >

                    <div class="candy">

                        <div class="candy-left"></div>

                        <div class="candy-body"></div>

                        <div class="candy-right"></div>

                    </div>

                </div>



                <!-- ลูกกวาดชิ้นที่ 2 -->

                <div
                    class="candy-slot"
                    id="candy2"
                >

                    <div class="candy">

                        <div class="candy-left"></div>

                        <div class="candy-body"></div>

                        <div class="candy-right"></div>

                    </div>

                </div>


            </div>



            <!-- =================================================
                 GAME OVER
            ================================================= -->

            <div id="gameOver">


                <div id="gameOverTitle">
                    หมดเวลาแล้ว!
                </div>


                <div id="gameOverText">

                    เวลาหมดแล้วจ้า

                </div>


                <button id="restartButton">
                    เริ่มเกมใหม่
                </button>


            </div>


        </div>


    </div>



    <script>

        /* =====================================================
           GAME SETTINGS
        ===================================================== */

        const GAME_WIDTH = 1920;

        const GAME_HEIGHT = 1080;

        const GAME_TIME = 30;



        /* =====================================================
           GAME VARIABLES
        ===================================================== */

        let timeLeft = GAME_TIME;

        let candyScore = 0;

        let timerInterval = null;

        let gameRunning = false;



        /* =====================================================
           DOM
        ===================================================== */

        const game =
            document.getElementById("game");


        const stage =
            document.getElementById("stage");


        const timerNumber =
            document.getElementById("timerNumber");


        const timerBarFill =
            document.getElementById("timerBarFill");


        const candy1 =
            document.getElementById("candy1");


        const candy2 =
            document.getElementById("candy2");


        const gameOver =
            document.getElementById("gameOver");


        const restartButton =
            document.getElementById("restartButton");



        /* =====================================================
           SCALE GAME TO SCREEN

           จุดสำคัญของเวอร์ชันนี้

           ไม่ใช้:
               background-size: cover

           เพราะจะทำให้ภาพโดนครอปเมื่ออัตราส่วนจอไม่เท่ากับ 16:9

           เราจะ scale ทั้ง Stage ให้พอดีกับจอแทน
        ===================================================== */

        function resizeGame() {

            const screenWidth =
                window.innerWidth;


            const screenHeight =
                window.innerHeight;


            const scaleX =
                screenWidth / GAME_WIDTH;


            const scaleY =
                screenHeight / GAME_HEIGHT;


            /*
                เลือกค่าที่เล็กกว่า
                เพื่อให้ภาพทั้ง 1920x1080
                อยู่ภายในหน้าจอทั้งหมด
            */

            const scale =
                Math.min(scaleX, scaleY);


            stage.style.transform =
                `
                translate(-50%, -50%)
                scale(${scale})
                `;

        }



        /* =====================================================
           UPDATE TIMER
        ===================================================== */

        function updateTimer() {

            timerNumber.textContent =
                timeLeft;

            const percent =
                Math.max(0, Math.min(100, (timeLeft / GAME_TIME) * 100));

            timerBarFill.style.width =
                percent + "%";

        }



        /* =====================================================
           UPDATE CANDY
        ===================================================== */

        function updateCandy() {

            // ลูกกวาด 2 ชิ้นแสดงค้างไว้ตลอดเวลา
            candy1.classList.add("show");
            candy2.classList.add("show");

        }


        /* =====================================================
           ADD CANDY

           ฟังก์ชันนี้เตรียมไว้สำหรับระบบจับผิดภาพ

           เมื่อผู้เล่นจับผิดถูกในอนาคต
           ให้เรียก:

               addCandy();

           ตัวอย่าง:

               if (foundDifference) {
                   addCandy();
               }

        ===================================================== */

        function addCandy() {

            if (!gameRunning) {
                return;
            }


            /*
                เกมนี้มีช่องลูกกวาด 2 ช่อง
                ดังนั้นคะแนนสูงสุดตอนนี้ = 2
            */

            if (candyScore >= 2) {
                return;
            }


            candyScore++;


            updateCandy();

        }



        /* =====================================================
           START GAME
        ===================================================== */

        function startGame() {

            /*
                หยุด Timer ตัวเก่าก่อน
            */

            clearInterval(timerInterval);


            /*
                Reset ค่า
            */

            timeLeft = GAME_TIME;

            candyScore = 0;

            gameRunning = true;


            /*
                Reset UI
            */

            updateTimer();

            updateCandy();


            gameOver.classList.remove("show");


            /*
                เริ่มจับเวลา
            */

            timerInterval =
                setInterval(
                    function () {

                        if (!gameRunning) {
                            return;
                        }


                        timeLeft--;


                        updateTimer();


                        /*
                            หมดเวลา
                        */

                        if (timeLeft <= 0) {

                            endGame();

                        }

                    },
                    1000
                );

        }



        /* =====================================================
           END GAME
        ===================================================== */

        function endGame() {

            gameRunning = false;


            clearInterval(timerInterval);


            timeLeft = 0;


            updateTimer();


            /*
                แสดง Game Over
            */

            gameOver.classList.add("show");

        }



        /* =====================================================
           RESTART BUTTON
        ===================================================== */

        restartButton.addEventListener(
            "click",
            function () {

                startGame();

            }
        );



        /* =====================================================
           RESIZE
        ===================================================== */

        window.addEventListener(
            "resize",
            function () {

                resizeGame();

            }
        );



        /* =====================================================
           START
           
           เปิดหน้าเกมแล้วเริ่มทันที
        ===================================================== */

        window.addEventListener(
            "load",
            function () {

                resizeGame();

                startGame();

            }
        );



        /* =====================================================
           DEBUG / TEST

           ถ้าจะทดสอบลูกกวาดในตอนนี้
           เปิด Console แล้วพิมพ์:

               addCandy();

           ครั้งแรก = ได้ลูกกวาด 1
           ครั้งที่สอง = ได้ลูกกวาด 2
        ===================================================== */

        window.addCandy = addCandy;


    </script>

</body>

</html>
