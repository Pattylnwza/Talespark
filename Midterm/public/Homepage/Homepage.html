<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TALESPARK - หน้าหลัก</title>
    <link rel="stylesheet" href="Homepage.css">
</head>
<body>

    <div id="game">
        
        <form id="startForm" class="overlay-container">
            <p style="position: absolute; 
            top: 42%; left: 50%; transform: translateX(-50%); 
            color: #501c1c; font-size: clamp(16px, 2.5vw, 24px); 
            font-weight: bold; text-shadow: 2px 2px 4px rgba(229, 206, 206, 0.8); 
            white-space: nowrap; pointer-events: none;">ยินดีต้อนรับสู่นิทานฮันเซลและเกรเทล</p>
            
            <!-- 1. ช่องพิมพ์ชื่อ (กำหนด id="playerName") -->
            <input type="text" 
                   id="playerName" 
                   class="name-input" 
                   placeholder="กรอกชื่อของคุณที่นี่..." 
                   required
                   oninvalid="this.setCustomValidity('กรุณากรอกชื่อของคุณก่อนเริ่มเกม')"
                   oninput="this.setCustomValidity('')">

            <!-- 2. เพิ่มช่องแสดง Error ถ้าเกิดข้อผิดพลาด -->
            <p id="error-text" style="display:none; color: #ff4757; position: absolute; top: 57%; left: 50%; transform: translateX(-50%); font-weight: bold; background: rgba(255,255,255,0.9); padding: 4px 12px; border-radius: 8px; font-size: 14px; white-space: nowrap;"></p>

            <!-- 3. เพิ่ม id="start-btn" ที่ปุ่ม -->
            <button type="submit" id="start-btn" class="start-btn">
                <span>เริ่มเกม</span>
            </button>
        </form>

    </div>

    <!-- ส่วนสั่งงาน Firebase และย้ายหน้า -->
    <script type="module">
        import { savePlayerAndStart } from "./Homepage.js";

        const startForm = document.getElementById('startForm');
        const nameInput = document.getElementById('playerName');
        const errorText = document.getElementById('error-text');
        const startBtn = document.getElementById('start-btn');

        // เปลี่ยนมาดักจับเหตุการณ์ submit ของฟอร์มแทน click
        startForm.addEventListener('submit', async (e) => {
            e.preventDefault(); // 🛑 ป้องกันไม่ให้หน้าเว็บรีเฟรชตัวเอง

            const inputVal = nameInput.value.trim();

            if (inputVal === "") {
                errorText.textContent = "กรุณากรอกชื่อก่อนเริ่มการเดินทาง!";
                errorText.style.display = "block";
                nameInput.style.borderColor = "#d63031";
                return;
            }

            errorText.style.display = "none";
            nameInput.style.borderColor = "#dfe6e9";

            const originalBtnText = startBtn.innerText;
            startBtn.innerText = "กำลังโหลดนิทาน...";
            startBtn.style.fontSize = "27px"; // 👈 เพิ่มบรรทัดนี้เพื่อขยายขนาดข้อความตอนโหลด
            startBtn.style.color = "#FFFFFF";
            startBtn.disabled = true; 

            try {
                // บันทึกข้อมูลเข้า Firebase
                const playerId = await savePlayerAndStart(inputVal);

                // บันทึกใส่ localStorage กันพลาดอีกชั้น
                localStorage.setItem('talespark_player', inputVal);
                localStorage.setItem('talespark_player_id', playerId);

                // ย้ายไปหน้า Story_ch1
                window.location.href = `../Story_ch1/Story_ch1.html?name=${encodeURIComponent(inputVal)}&id=${playerId}`;
                
            } catch (error) {
                console.error("🔥 เกิดข้อผิดพลาด:", error);
                errorText.textContent = "ระบบมีปัญหาในการบันทึกข้อมูล กรุณาลองใหม่ (ดูรายละเอียดใน F12)";
                errorText.style.display = "block";
                
                startBtn.innerText = originalBtnText;
                startBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
