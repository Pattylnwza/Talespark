<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>มินิเกมที่ 1 - หาทางกลับบ้านในป่า</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
}

body {
    overflow: hidden;
    background: #17291d;
    font-family: Tahoma, "Noto Sans Thai", Arial, sans-serif;
}


/* =========================================================
   GAME
========================================================= */

#game {
    position: relative;

    width: 100vw;
    height: 56.25vw;

    max-width: 177.777777vh;
    max-height: 100vh;

    margin: auto;

    overflow: hidden;

    background-image: url("BG_mini1.png");
    background-repeat: no-repeat;
    background-position: center center;
    background-size: 100% 100%;
}


/* =========================================================
   START SCREEN
========================================================= */

#startScreen {
    position: absolute;
    inset: 0;

    z-index: 1000;

    display: flex;
    justify-content: center;
    align-items: center;

    background: rgba(0, 0, 0, 0.28);
}

.startBox {
    width: 42%;
    max-width: 720px;

    padding: 28px 35px;

    text-align: center;

    background: linear-gradient(
        #fff5d8,
        #f6d994
    );

    border: 5px solid #71341c;
    border-radius: 28px;

    box-shadow:
        0 12px 35px rgba(0,0,0,.45);
}

.startBox h1 {
    margin: 0 0 14px;

    color: #692c15;

    font-size: clamp(28px, 3vw, 48px);
    line-height: 1.2;

    font-weight: 900;
}

.startBox p {
    margin: 8px 0;

    color: #71351d;

    font-size: clamp(16px, 1.3vw, 25px);
    line-height: 1.55;

    font-weight: 700;
}

.startButton {
    margin-top: 16px;

    padding: 11px 36px;

    border: 4px solid #653019;
    border-radius: 20px;

    background: linear-gradient(
        #82c95c,
        #4e9139
    );

    color: white;

    font-size: clamp(18px, 1.5vw, 28px);
    font-weight: 900;

    cursor: pointer;

    box-shadow:
        0 5px 0 #4c2918;
}

.startButton:hover {
    filter: brightness(1.08);
    transform: translateY(-2px);
}


/* =========================================================
   STONE COUNTER
========================================================= */

#stoneCounter {
    position: absolute;

    z-index: 30;

    left: 55.0%;
    top: 7.8%;

    width: 18.5%;
    height: 10.5%;

    color: #672c16;

    text-align: center;

    font-size: clamp(15px, 1.25vw, 30px);

    font-weight: 900;

    pointer-events: none;
}

#bagStones {
    position: absolute;

    left: 8%;
    right: 8%;

    top: 52%;
    height: 44%;

    display: flex;

    justify-content: flex-start;
    align-items: center;

    gap: clamp(2px, .25vw, 15px);
}

.bagStone {
    display: inline-block;

    font-size: clamp(20px, 1.45vw, 29px);

    line-height: 1;

    transition:
        opacity .25s,
        transform .25s;
}

.bagStone.hidden {
    opacity: 0;
    transform: scale(.2);
}


/* =========================================================
   QUESTION AREA
   ตำแหน่งเดิม ไม่เปลี่ยน
========================================================= */

#questionArea {
    position: absolute;

    z-index: 20;

    left: 49.0%;
    top: 25.0%;

    width: 34.5%;
    min-height: 52%;

    display: flex;

    flex-direction: column;

    align-items: center;

    text-align: center;
}

#questionTitle {
    width: 100%;

    margin-bottom: 15px;

    color: #672b15;

    font-size: clamp(19px, 1.55vw, 30px);

    line-height: 1.25;

    font-weight: 900;
}

#questionText {
    width: 96%;

    color: #6a2e18;

    font-size: clamp(15px, 1.18vw, 23px);

    line-height: 1.55;

    font-weight: 700;
}

#questionText b {
    color: #8d3c1d;
}

#equation {
    margin-top: 14px;

    color: #642913;

    font-size: clamp(38px, 4vw, 60px);

    line-height: 2;

    font-weight: 900;
}


/* =========================================================
   ANSWERS
========================================================= */

#answers {
    width: 100%;

    display: grid;

    grid-template-columns: repeat(4, 1fr);

    gap: 9px;

    margin-top: 20px;
}

.answer {
    width: 100%;

    height: clamp(55px, 5.2vw, 76px);

    border: 3px solid #653019;
    border-radius: 15px;

    color: white;

    font-size: clamp(20px, 1.75vw, 34px);

    font-weight: 900;

    cursor: pointer;

    box-shadow:
        0 4px 0 rgba(75,35,17,.45);

    transition:
        transform .12s,
        filter .12s;
}

.answer:nth-child(1) {
    background: #73c6df;
}

.answer:nth-child(2) {
    background: #78b451;
}

.answer:nth-child(3) {
    background: #f3b93b;
}

.answer:nth-child(4) {
    background: #e35b4d;
}

.answer:hover {
    transform: translateY(-3px);
    filter: brightness(1.08);
}

.answer:active {
    transform: translateY(2px);
}


/* =========================================================
   FEEDBACK
========================================================= */

#feedback {
    width: 100%;

    min-height: 60px;

    margin-top: 8px;

    color: #71321b;

    font-size: clamp(14px, 2vw, 21px);

    line-height: 1.45;

    font-weight: 900;
}

#feedback.correct {
    color: #3d8c35;
}

#feedback.wrong {
    color: #b83b2e;
}


/* =========================================================
   NEXT BUTTON
========================================================= */

#nextButton {
    display: none;

    margin-top: 2px;

    padding: 20px 50px;

    border: 3px solid #653019;
    border-radius: 16px;

    background: linear-gradient(
        #ffc55b,
        #e88b31
    );

    color: white;

    font-size: clamp(15px, 1.1vw, 22px);

    font-weight: 900;

    cursor: pointer;

    box-shadow:
        0 4px 0 #5a2a17;
}


/* =========================================================
   GROUND STONES
   ข้อ 4
   ปรับเฉพาะตำแหน่งก้อนกรวด
========================================================= */

#groundStones {
    position: absolute;

    z-index: 50;

    left: 17.0%;
    top: 27.0%;

    width: 29.0%;
    height: 47%;

    pointer-events: none;
}

.groundStone {
    position: absolute;

    width: clamp(35px, 3vw, 58px);
    height: clamp(35px, 3vw, 58px);

    display: none;

    align-items: center;
    justify-content: center;

    border: none;

    padding: 0;

    background: transparent;

    font-size: clamp(28px, 2.7vw, 50px);

    line-height: 1;

    cursor: pointer;

    filter:
        drop-shadow(
            0 4px 3px rgba(0,0,0,.45)
        );

    pointer-events: auto;

    transition:
        transform .15s,
        filter .15s;
}


/* =========================================================
   ตำแหน่งใหม่
   จัดก้อนกรวดให้รวมกันเป็นกลุ่มมากขึ้น
   โดยยังอยู่ในพื้นที่พื้นเดิมของ Ref
========================================================= */

.groundStone[data-id="1"] {
    left: 48%;
    top: 48%;
}

.groundStone[data-id="2"] {
    left: 58%;
    top: 53%;
}

.groundStone[data-id="3"] {
    left: 64%;
    top: 45%;
}


.groundStone.active {
    display: flex;
}

.groundStone:hover {
    transform:
        scale(1.2)
        translateY(-4px);

    filter:
        drop-shadow(
            0 7px 4px rgba(0,0,0,.55)
        );
}

.groundStone.collected {
    animation:
        collectStone .55s forwards;
}


@keyframes collectStone {

    0% {
        opacity: 1;
        transform: scale(1);
    }

    45% {
        transform: scale(1.3);
    }

    100% {
        opacity: 0;

        transform:
            translateY(-80px)
            scale(.2);
    }
}


/* =========================================================
   PATHS
========================================================= */

#paths {
    display: none;

    width: 100%;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 9px;

    margin-top: 30px;
}

.path {
    min-height:
        clamp(100px, 9vw, 135px);

    padding: 8px;

    border: 4px solid #653019;

    border-radius: 16px;

    background: linear-gradient(
        #8dc95e,
        #57933f
    );

    color: white;

    cursor: pointer;

    box-shadow:
        0 5px 0 #52301d;

    transition:
        transform .15s,
        filter .15s;
}

.path:hover {
    transform: translateY(-4px);
    filter: brightness(1.1);
}

.pathIcon {
    font-size:
        clamp(25px, 2vw, 40px);
}

.pathName {
    margin-top: 3px;

    font-size:
        clamp(14px, 1.05vw, 21px);

    font-weight: 900;
}

.pathArrow {
    margin-top: 3px;

    font-size:
        clamp(18px, 1.5vw, 29px);
}


/* =========================================================
   SUCCESS
========================================================= */

#success {
    position: absolute;

    inset: 0;

    z-index: 1000;

    display: none;

    align-items: center;
    justify-content: center;

    background:
        rgba(15,40,25,.58);
}

.successBox {
    width: 44%;

    max-width: 760px;

    padding: 28px;

    background: linear-gradient(
        #fff3cd,
        #ffd77d
    );

    border: 5px solid #6c3018;

    border-radius: 30px;

    text-align: center;

    box-shadow:
        0 12px 35px rgba(0,0,0,.45);
}

.successEmoji {
    font-size:
        clamp(45px, 4vw, 75px);
}

.successBox h1 {
    margin: 5px;

    color: #682d16;

    font-size:
        clamp(30px, 2.8vw, 50px);
}

.successBox p {
    color: #71351d;

    font-size:
        clamp(16px, 1.3vw, 25px);

    line-height: 1.6;

    font-weight: 700;
}

.restartButton {
    margin-top: 10px;

    padding: 10px 32px;

    border: 4px solid #633019;

    border-radius: 18px;

    background: linear-gradient(
        #82c85b,
        #4b9237
    );

    color: white;

    font-size:
        clamp(17px, 1.3vw, 25px);

    font-weight: 900;

    cursor: pointer;

    box-shadow:
        0 4px 0 #4a2918;
}


/* =========================================================
   CONFETTI
========================================================= */

.confetti {
    position: fixed;

    z-index: 2000;

    top: -30px;

    font-size: 22px;

    animation:
        confettiFall 2.8s linear forwards;
}

@keyframes confettiFall {

    to {

        transform:
            translateY(110vh)
            rotate(720deg);

        opacity: 0;

    }

}


/* =========================================================
   SHAKE
========================================================= */

.answer.wrong,
.path.wrong {
    animation:
        shake .35s;
}

@keyframes shake {

    0%,
    100% {
        transform:
            translateX(0);
    }

    25% {
        transform:
            translateX(-7px);
    }

    75% {
        transform:
            translateX(7px);
    }

}


/* =========================================================
   RESPONSIVE
========================================================= */

@media (max-width: 900px) {

    #questionArea {
        left: 47.5%;
        width: 36%;
    }

    #answers {
        gap: 5px;
    }

    .answer {
        border-width: 2px;
        border-radius: 10px;
    }

}

</style>
</head>


<body>


<div id="game">


<!-- =====================================================
     START SCREEN
===================================================== -->

<div id="startScreen">

    <div class="startBox">

        <h1>
            🌲 หาทางกลับบ้านในป่า 🌲
        </h1>

        <p>
            ช่วยฮันเซลกับเกรเทล
            ตอบโจทย์คณิตศาสตร์
            และเก็บก้อนกรวดให้ครบ
        </p>

        <p>
            🪨 เป้าหมายคือเก็บก้อนกรวดให้ครบ 10 ก้อน
            เพื่อเดินทางไปยังจุดเช็กพอยต์
        </p>

        <button
            class="startButton"
            onclick="startGame()">

            ▶ เริ่มเกม

        </button>

    </div>

</div>


<!-- =====================================================
     STONE COUNTER
===================================================== -->

<div id="stoneCounter">

    <div>
        ก้อนกรวดสะสม:
        <span id="stoneNumber">4</span>/10
    </div>

    <div id="bagStones">

        <span class="bagStone">🪨</span>
        <span class="bagStone">🪨</span>
        <span class="bagStone">🪨</span>
        <span class="bagStone">🪨</span>
        <span class="bagStone">🪨</span>
        <span class="bagStone">🪨</span>
        <span class="bagStone">🪨</span>
        <span class="bagStone">🪨</span>
        <span class="bagStone">🪨</span>
        <span class="bagStone">🪨</span>

    </div>

</div>


<!-- =====================================================
     QUESTION AREA
===================================================== -->

<div id="questionArea">

    <div id="questionTitle"></div>

    <div id="questionText"></div>

    <div id="equation"></div>

    <div id="answers"></div>

    <div id="paths"></div>

    <div id="feedback"></div>

    <button
        id="nextButton"
        onclick="nextQuestion()">

        ไปต่อ ➜

    </button>

</div>


<!-- =====================================================
     GROUND STONES
===================================================== -->

<div id="groundStones">

    <button
        class="groundStone"
        data-id="1"
        onclick="collectStone(this)"
        aria-label="ก้อนกรวดที่ 1">

        🪨

    </button>


    <button
        class="groundStone"
        data-id="2"
        onclick="collectStone(this)"
        aria-label="ก้อนกรวดที่ 2">

        🪨

    </button>


    <button
        class="groundStone"
        data-id="3"
        onclick="collectStone(this)"
        aria-label="ก้อนกรวดที่ 3">

        🪨

    </button>

</div>


<!-- =====================================================
     SUCCESS
===================================================== -->

<div id="success">

    <div class="successBox">

        <div class="successEmoji">
            🎉 🪨 🏠
        </div>

        <h1>
            เก่งมาก!
        </h1>

        <p>
            เด็ก ๆ ผ่านจุดเช็กพอยต์ที่ 1 แล้ว!
            <br>
            ก้อนกรวดทั้ง 10 ก้อน
            ช่วยนำทางกลับบ้านได้สำเร็จ
        </p>

        <button
            class="restartButton"
            onclick="restartGame()">

            🔄 เล่นอีกครั้ง

        </button>

    </div>

</div>


</div>


<script>


/* =========================================================
   QUESTIONS
========================================================= */

const questions = [

    {
        title:
            "ข้อ 1 — ก้อนกรวด 🪨",

        text:
            "ตอนนี้ฮันเซลกับเกรเทลมีก้อนกรวด " +
            "<b>4 ก้อน</b> แต่ต้องมี <b>6 ก้อน</b> " +
            "เพื่อไปถึงจุดเช็กพอยต์<br>" +
            "ต้องหาก้อนกรวดเพิ่มอีกกี่ก้อน?",

        equation:
            "6 − 4 = ?",

        answers:
            [1, 6, 2, 8],

        correct:
            2
    },


    {
        title:
            "ข้อ 2 — นับก้อนกรวด 🪨",

        text:
            "ระหว่างทางเด็ก ๆ เจอก้อนกรวดเพิ่ม " +
            "<b>3 ก้อน</b><br>" +
            "ตอนนี้มี <b>6 ก้อน</b> จากข้อแรก<br>" +
            "ตอนนี้เด็ก ๆ มีก้อนกรวดทั้งหมดกี่ก้อน?",

        equation:
            "6 + 3 = ?",

        answers:
            [8, 9, 10, 3],

        correct:
            9
    },


    {
        title:
            "ข้อ 3 — หินที่หายไป 🪨",

        text:
            "ระหว่างเดินทาง มีนกบินมาคาบก้อนกรวดไป " +
            "<b>2 ก้อน</b><br>" +
            "ตอนนี้มี <b>9 ก้อน</b><br>" +
            "เหลือก้อนกรวดกี่ก้อน?",

        equation:
            "9 − 2 = ?",

        answers:
            [6, 7, 8, 11],

        correct:
            7
    },


    {
        title:
            "ข้อ 4 — เติมจำนวนที่หายไป 🪨",

        text:
            "เด็ก ๆ ต้องมี <b>10 ก้อน</b> " +
            "เพื่อเปิดทางไปจุดเช็กพอยต์<br>" +
            "ตอนนี้มี <b>7 ก้อน</b><br>" +
            "ตอบให้ถูก แล้วเก็บก้อนกรวดที่อยู่บนพื้น",

        equation:
            "7 + ? = 10",

        answers:
            [2, 3, 4, 17],

        correct:
            3
    },


    {
        title:
            "ข้อ 5 — จุดเช็กพอยต์ 🏠",

        text:
            "ตอนนี้เด็ก ๆ มีก้อนกรวด <b>10 ก้อนพอดี</b><br>" +
            "ก้อนกรวดทั้ง 10 ก้อนจะช่วยให้เด็ก ๆ " +
            "เดินตามทางกลับบ้านได้<br>" +
            "<b>เลือกเส้นทางที่ตรงกับก้อนกรวดที่วางไว้เพื่อกลับบ้าน</b>",

        equation:
            "",

        answers:
            [],

        correct:
            "A"
    }

];


/* =========================================================
   GAME STATE
========================================================= */

let currentQuestion = 0;

let stones = 4;

let answered = false;

let collectedStones = 0;


/* =========================================================
   ELEMENTS
========================================================= */

const startScreen =
    document.getElementById(
        "startScreen"
    );

const questionTitle =
    document.getElementById(
        "questionTitle"
    );

const questionText =
    document.getElementById(
        "questionText"
    );

const equation =
    document.getElementById(
        "equation"
    );

const answers =
    document.getElementById(
        "answers"
    );

const paths =
    document.getElementById(
        "paths"
    );

const feedback =
    document.getElementById(
        "feedback"
    );

const nextButton =
    document.getElementById(
        "nextButton"
    );

const stoneNumber =
    document.getElementById(
        "stoneNumber"
    );

const bagStones =
    document.querySelectorAll(
        ".bagStone"
    );

const groundStones =
    document.querySelectorAll(
        ".groundStone"
    );

const success =
    document.getElementById(
        "success"
    );


/* =========================================================
   START GAME
========================================================= */

function startGame() {

    startScreen.style.display =
        "none";

    resetGame();

    showQuestion(0);

}


/* =========================================================
   RESET GAME
========================================================= */

function resetGame() {

    currentQuestion = 0;

    stones = 4;

    answered = false;

    collectedStones = 0;

    success.style.display =
        "none";


    groundStones.forEach(
        stone => {

            stone.classList.remove(
                "active",
                "collected"
            );

            stone.disabled =
                false;

            stone.style.pointerEvents =
                "auto";

        }
    );


    updateStoneCounter();

}


/* =========================================================
   UPDATE COUNTER
========================================================= */

function updateStoneCounter() {

    stoneNumber.textContent =
        stones;


    bagStones.forEach(
        (stone, index) => {

            if (index < stones) {

                stone.classList.remove(
                    "hidden"
                );

            }

            else {

                stone.classList.add(
                    "hidden"
                );

            }

        }
    );

}


/* =========================================================
   SHOW QUESTION
========================================================= */

function showQuestion(index) {

    currentQuestion =
        index;

    answered =
        false;


    const question =
        questions[index];


    questionTitle.innerHTML =
        question.title;


    questionText.innerHTML =
        question.text;


    equation.innerHTML =
        question.equation;


    feedback.innerHTML =
        "";

    feedback.className =
        "";


    answers.innerHTML =
        "";

    paths.innerHTML =
        "";


    answers.style.display =
        "grid";

    paths.style.display =
        "none";


    nextButton.style.display =
        "none";


    groundStones.forEach(
        stone => {

            stone.classList.remove(
                "active"
            );

        }
    );


    /* =====================================================
       ข้อ 5
    ===================================================== */

    if (index === 4) {

        answers.style.display =
            "none";

        createPaths();

        return;

    }


    /* =====================================================
       สร้างปุ่มคำตอบ
    ===================================================== */

    question.answers.forEach(
        answerValue => {

            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "answer";


            button.textContent =
                answerValue;


            button.onclick =
                function() {

                    checkAnswer(
                        answerValue,
                        button
                    );

                };


            answers.appendChild(
                button
            );

        }
    );

}


/* =========================================================
   CHECK ANSWER
========================================================= */

function checkAnswer(
    value,
    clickedButton
) {

    if (answered) {

        return;

    }


    const question =
        questions[currentQuestion];


    if (
        value ===
        question.correct
    ) {

        answered =
            true;


        /* =================================================
           ข้อ 1
        ================================================= */

        if (
            currentQuestion === 0
        ) {

            stones =
                6;


            feedback.innerHTML =
                "🎉 ถูกต้อง! ตอนนี้มีก้อนกรวด 6 ก้อนแล้ว 🪨";

        }


        /* =================================================
           ข้อ 2
        ================================================= */

        else if (
            currentQuestion === 1
        ) {

            stones =
                9;


            feedback.innerHTML =
                "🎉 ถูกต้อง! 6 + 3 = 9 " +
                "ตอนนี้มีก้อนกรวด 9 ก้อน 🪨";

        }


        /* =================================================
           ข้อ 3
        ================================================= */

        else if (
            currentQuestion === 2
        ) {

            stones =
                7;


            feedback.innerHTML =
                "🎉 ถูกต้อง! 9 − 2 = 7<br>" +
                "🐦 นกคาบก้อนกรวดไป 2 ก้อน";


            removeTwoStones();

        }


        /* =================================================
           ข้อ 4
        ================================================= */

        else if (
            currentQuestion === 3
        ) {

            feedback.innerHTML =
                "🎉 ถูกต้อง! ต้องเก็บก้อนกรวดเพิ่มอีก 3 ก้อน 🪨";


            collectedStones =
                0;


            groundStones.forEach(
                stone => {

                    stone.classList.add(
                        "active"
                    );

                    stone.disabled =
                        false;

                    stone.style.pointerEvents =
                        "auto";

                }
            );


            updateStoneCounter();


            return;

        }


        feedback.className =
            "correct";


        updateStoneCounter();


        nextButton.style.display =
            "block";

    }

    else {

        clickedButton.classList.add(
            "wrong"
        );


        feedback.className =
            "wrong";


        feedback.innerHTML =
            "❌ ยังไม่ถูกนะ ลองคิดอีกครั้ง 😊";


        setTimeout(
            function() {

                clickedButton.classList.remove(
                    "wrong"
                );

                feedback.innerHTML =
                    "";

                feedback.className =
                    "";

            },
            700
        );

    }

}


/* =========================================================
   REMOVE 2 STONES
========================================================= */

function removeTwoStones() {

    let removed =
        0;


    for (
        let i =
            bagStones.length - 1;

        i >= 0 &&
        removed < 2;

        i--
    ) {

        if (
            !bagStones[i]
                .classList
                .contains(
                    "hidden"
                )
        ) {

            bagStones[i]
                .classList
                .add(
                    "hidden"
                );

            removed++;

        }

    }


    stoneNumber.textContent =
        "7";

}


/* =========================================================
   COLLECT STONE
========================================================= */

function collectStone(stone) {

    if (
        stone.classList.contains(
            "collected"
        )
    ) {

        return;

    }


    stone.classList.add(
        "collected"
    );


    stone.disabled =
        true;


    collectedStones++;

    stones++;


    updateStoneCounter();


    if (
        collectedStones === 3
    ) {

        setTimeout(
            function() {

                feedback.className =
                    "correct";


                feedback.innerHTML =
                    "🎉 เก็บครบ 3 ก้อนแล้ว! " +
                    "ตอนนี้มีก้อนกรวดครบ 10 ก้อนพอดี 🪨";


                nextButton.textContent =
                    "ไปยังจุดเช็กพอยต์ ➜";


                nextButton.style.display =
                    "block";


                groundStones.forEach(
                    stone => {

                        stone.style.pointerEvents =
                            "none";

                    }
                );

            },
            550
        );

    }

}


/* =========================================================
   NEXT QUESTION
========================================================= */

function nextQuestion() {

    if (
        currentQuestion <
        questions.length - 1
    ) {

        showQuestion(
            currentQuestion + 1
        );

    }

}


/* =========================================================
   CREATE PATHS
========================================================= */

function createPaths() {

    paths.style.display =
        "grid";


    paths.appendChild(
        createPath(
            "A",
            "🌲",
            "➡️ 🏠",
            true
        )
    );


    paths.appendChild(
        createPath(
            "B",
            "🌲",
            "➡️ ⛰️",
            false
        )
    );


    paths.appendChild(
        createPath(
            "C",
            "🌲",
            "➡️ 🌳",
            false
        )
    );

}


/* =========================================================
   CREATE PATH
========================================================= */

function createPath(
    name,
    icon,
    destination,
    correct
) {

    const button =
        document.createElement(
            "button"
        );


    button.className =
        "path";


    button.innerHTML = `

        <div class="pathIcon">
            ${icon}
        </div>

        <div class="pathName">
            ทาง ${name}
        </div>

        <div class="pathArrow">
            ${destination}
        </div>

    `;


    button.onclick =
        function() {

            choosePath(
                name,
                correct,
                button
            );

        };


    return button;

}


/* =========================================================
   CHOOSE PATH
========================================================= */

function choosePath(
    name,
    correct,
    button
) {

    if (correct) {

        button.style.transform =
            "scale(1.08)";


        button.style.filter =
            "brightness(1.2)";


        feedback.className =
            "correct";


        feedback.innerHTML =
            "🎉 ถูกต้อง! ทาง A มีลูกศรไปบ้าน 🏠";


        setTimeout(
            function() {

                showSuccess();

            },
            900
        );

    }

    else {

        feedback.className =
            "wrong";


        feedback.innerHTML =
            "❌ ทางนี้ไม่ใช่ทางกลับบ้าน " +
            "ลองเลือกเส้นทางใหม่อีกครั้งนะ 😊";


        button.classList.add(
            "wrong"
        );


        setTimeout(
            function() {

                button.classList.remove(
                    "wrong"
                );

                feedback.innerHTML =
                    "";

                feedback.className =
                    "";

            },
            800
        );

    }

}


/* =========================================================
   SUCCESS
========================================================= */

function showSuccess() {

    success.style.display =
        "flex";


    createConfetti();

}


/* =========================================================
   CONFETTI
========================================================= */

function createConfetti() {

    const items = [
        "🎉",
        "⭐",
        "✨",
        "🪨",
        "🍀"
    ];


    for (
        let i = 0;
        i < 35;
        i++
    ) {

        const item =
            document.createElement(
                "div"
            );


        item.className =
            "confetti";


        item.textContent =
            items[
                Math.floor(
                    Math.random() *
                    items.length
                )
            ];


        item.style.left =
            Math.random() *
            100 +
            "vw";


        item.style.animationDelay =
            Math.random() *
            1.2 +
            "s";


        document.body.appendChild(
            item
        );


        setTimeout(
            function() {

                item.remove();

            },
            4000
        );

    }

}


/* =========================================================
   RESTART
========================================================= */

function restartGame() {

    resetGame();

    showQuestion(0);

}


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            currentQuestion < 4 &&
            ["1", "2", "3", "4"]
                .includes(event.key)
        ) {

            const index =
                Number(event.key) - 1;


            const buttons =
                document.querySelectorAll(
                    ".answer"
                );


            if (
                buttons[index]
            ) {

                buttons[index].click();

            }

        }

    }
);


/* =========================================================
   INITIALIZE
========================================================= */

updateStoneCounter();

</script>

</body>
</html>
